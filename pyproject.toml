[project]
name = "air"
version = "0.1.0"
description = "Aclima air — industry / community / regulator flagship prototype"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
air-server = "air.server.__main__:main"
air-datagen = "air.datagen.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `air` is installed editable by `uv sync`, but the server is *run* from
# PYTHONPATH=src (Dockerfile:43) because `config.REPO_ROOT` is
# `Path(__file__).parents[3]` and a site-packages copy would point it at the
# wrong tree. Setting it here means the tests exercise the same import path the
# deployed server does, whether or not the project happens to be installed.
# `scripts` is on the path so the frozen touchdown estimator in
# `scripts/probe_touchdown.py` is testable; it is a design record, not a
# library, and nothing under `src` imports it.
pythonpath = ["src", "scripts"]
addopts = "-q --strict-markers"
markers = [
    "needs_db: requires data/air.db, which is gitignored — build it with the pinned command in CLAUDE.md",
]
