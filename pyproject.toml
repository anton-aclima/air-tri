[project]
name = "air"
version = "0.1.0"
description = "Aclima air — industry / community / regulator flagship prototype"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "numpy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
air-server = "air.server.__main__:main"
air-datagen = "air.datagen.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air"]
